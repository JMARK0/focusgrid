<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5c94fc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FocusGrid" />

    <link rel="canonical" href="https://focusgrid-mmtc.vercel.app/" />

    <meta
      name="description"
      content="FocusGrid — a fast-paced attention and reaction-speed trainer. Tap the grid in order across 5 stages of numbers, letters, and times tables before the clock runs out."
    />

    <!-- Open Graph: this is what WhatsApp, Telegram, Facebook, Slack, and
         iMessage read to build a link-preview card. Without these tags a
         shared link shows no title/description/image at all. Image/URL are
         absolute — some crawlers (WhatsApp's included) won't reliably
         resolve relative ones. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FocusGrid" />
    <meta property="og:url" content="https://focusgrid-mmtc.vercel.app/" />
    <meta property="og:title" content="FocusGrid — Focus & Reaction Speed Trainer" />
    <meta
      property="og:description"
      content="Tap the grid in order before time runs out. 5 stages, numbers/letters/times-tables, reverse mode, and a hardcore Expert tier."
    />
    <meta property="og:image" content="https://focusgrid-mmtc.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FocusGrid — Focus & Reaction Speed Trainer" />
    <meta
      name="twitter:description"
      content="Tap the grid in order before time runs out. 5 stages, numbers/letters/times-tables, reverse mode, and a hardcore Expert tier."
    />
    <meta name="twitter:image" content="https://focusgrid-mmtc.vercel.app/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Non-blocking font load: fetch the stylesheet without letting it hold up
      first paint, then swap it to an active stylesheet once it arrives. The
      fallback stacks in index.css (system-ui, etc.) cover everything until
      then, and the <noscript> tag below still loads it normally if JS is
      disabled.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      />
    </noscript>
    <title>FocusGrid</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
